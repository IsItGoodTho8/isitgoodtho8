<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Connected - @isitgoodtho8</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #17121c; color: #fff; text-align: center; padding: 60px 20px; }
  h1 { color: #ff007a; }
  #code { font-size: 18px; background: #2a2333; padding: 16px; border-radius: 8px; word-break: break-all; margin-top: 20px; user-select: all; }
  button { margin-top: 16px; padding: 10px 20px; border-radius: 6px; border: none; background: #ff007a; color: #fff; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>
<h1>You're connected</h1>
<p>Copy the code below and give it back to Tameri.</p>
<div id="code">reading code...</div>
<button onclick="copyCode()">Copy code</button>
<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code") || "No code found in the URL.";
  document.getElementById("code").textContent = code;
  function copyCode() {
    navigator.clipboard.writeText(code);
    alert("Copied!");
  }
</script>
</body>
</html>
